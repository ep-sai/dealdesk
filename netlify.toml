[functions]
  directory = "netlify/functions"

[functions."sharepoint-upload"]
  timeout = 26

[functions."anthropic"]
  timeout = 26

[[redirects]]
  from = "/api/anthropic"
  to = "/.netlify/functions/anthropic"
  status = 200

[[redirects]]
  from = "/api/sharepoint-upload"
  to = "/.netlify/functions/sharepoint-upload"
  status = 200

[[redirects]]
  from = "/api/slack"
  to = "/.netlify/functions/slack"
  status = 200

[functions."keepalive"]
  schedule = "0 6 */3 * *"

[[redirects]]
  from = "/api/ingest"
  to = "/.netlify/functions/ingest"
  status = 200

[[redirects]]
  from = "/api/export"
  to = "/.netlify/functions/export"
  status = 200

[[redirects]]
  from = "/api/contracts"
  to = "/.netlify/functions/contracts"
  status = 200
